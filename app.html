<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ISV DG Sales Trainer — EMEA</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<style>
* { margin:0; padding:0; box-sizing:border-box; }
body { font-family:'Amazon Ember','Segoe UI',system-ui,sans-serif; background:#0f1419; color:#e2e8f0; height:100vh; display:flex; flex-direction:column; overflow:hidden; }

.top-bar {
  display:flex; align-items:center; justify-content:space-between;
  padding:10px 24px; background:#1a2332; border-bottom:1px solid #2d3748;
  flex-shrink:0;
}
.top-bar .brand { display:flex; align-items:center; gap:12px; }
.top-bar .brand i.fa-brands { font-size:28px; color:#ff9900; }
.top-bar .brand h1 { font-size:18px; font-weight:700; color:#fff; }
.top-bar .brand .sub { font-size:11px; color:#8892a4; margin-top:2px; }

.tabs {
  display:flex; align-items:center; gap:4px;
}
.tab {
  padding:10px 18px; border-radius:8px; font-size:13px; font-weight:600;
  color:#8892a4; cursor:pointer; transition:all 0.2s; border:1px solid transparent;
  text-decoration:none; display:flex; align-items:center; gap:6px;
}
.tab:hover { background:#2d3748; color:#e2e8f0; }
.tab.active { background:rgba(124,77,255,0.15); color:#7c4dff; border-color:rgba(124,77,255,0.3); }

.tab-content { flex:1; position:relative; }
.tab-frame { position:absolute; top:0; left:0; width:100%; height:100%; border:none; display:none; }
.tab-frame.active { display:block; }

@media(max-width:768px) {
  .tabs { gap:2px; }
  .tab { padding:8px 10px; font-size:11px; }
  .tab span { display:none; }
}
</style>
</head>
<body>

<div class="top-bar">
  <div class="brand">
    <i class="fa-brands fa-aws"></i>
    <div>
      <h1>ISV DG Sales Trainer</h1>
      <div class="sub">EMEA Demand Generation — AI Coaching Platform</div>
    </div>
  </div>
  <div class="tabs">
    <a class="tab active" onclick="switchTab('prospecting')" id="tab-prospecting">
      <i class="fa-solid fa-phone"></i><span>Prospecting</span>
    </a>
    <a class="tab" onclick="switchTab('roleplay')" id="tab-roleplay">
      <i class="fa-solid fa-comments"></i><span>Call Simulator</span>
    </a>
    <a class="tab" onclick="switchTab('services')" id="tab-services">
      <i class="fa-solid fa-cloud"></i><span>AWS Services</span>
    </a>
    <a class="tab" onclick="switchTab('dashboard')" id="tab-dashboard">
      <i class="fa-solid fa-chart-line"></i><span>Dashboard</span>
    </a>
  </div>
</div>

<div class="tab-content">
  <iframe class="tab-frame active" id="frame-prospecting" src="index.html"></iframe>
  <iframe class="tab-frame" id="frame-roleplay" src="roleplay.html"></iframe>
  <iframe class="tab-frame" id="frame-services" src="" data-src="services.html"></iframe>
  <iframe class="tab-frame" id="frame-dashboard" src="" data-src="dashboard.html"></iframe>
</div>

<script>
function switchTab(name) {
  // Update tabs
  document.querySelectorAll('.tab').forEach(function(t) { t.classList.remove('active'); });
  document.getElementById('tab-' + name).classList.add('active');
  
  // Update frames
  document.querySelectorAll('.tab-frame').forEach(function(f) { f.classList.remove('active'); });
  var frame = document.getElementById('frame-' + name);
  frame.classList.add('active');
  
  // Lazy load: only load iframe src when tab is first clicked
  if(!frame.src || frame.src === '' || frame.src === window.location.href) {
    var dataSrc = frame.getAttribute('data-src');
    if(dataSrc) frame.src = dataSrc;
  }
}
</script>

</body>
</html>
