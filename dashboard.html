<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DGR Coaching Dashboard — ISV EMEA</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<style>
:root {
  --bg: #0f1419;
  --card: #1a2332;
  --border: #2d3748;
  --text: #e2e8f0;
  --muted: #8892a4;
  --primary: #7c4dff;
  --success: #00c853;
  --warning: #ff9100;
  --danger: #ff1744;
  --info: #00b0ff;
  --accent: #ff9900;
}
* { margin:0; padding:0; box-sizing:border-box; }
body { font-family:'Amazon Ember','Segoe UI',system-ui,sans-serif; background:var(--bg); color:var(--text); min-height:100vh; }
.header { background:linear-gradient(135deg,#1a1a2e,#16213e); padding:24px 40px; border-bottom:1px solid var(--border); display:flex; align-items:center; justify-content:space-between; }
.header h1 { font-size:22px; font-weight:700; }
.header h1 span { color:var(--accent); }
.header .subtitle { color:var(--muted); font-size:13px; margin-top:4px; }
.header .badge { background:var(--primary); color:white; padding:4px 12px; border-radius:20px; font-size:11px; font-weight:600; }

.container { max-width:1400px; margin:0 auto; padding:24px 40px; }

/* KPI Row */
.kpi-row { display:grid; grid-template-columns:repeat(auto-fit,minmax(200px,1fr)); gap:16px; margin-bottom:24px; }
.kpi-card { background:var(--card); border:1px solid var(--border); border-radius:12px; padding:20px; text-align:center; }
.kpi-card .kpi-value { font-size:32px; font-weight:700; margin:8px 0 4px; }
.kpi-card .kpi-label { font-size:11px; text-transform:uppercase; color:var(--muted); letter-spacing:0.5px; }
.kpi-card .kpi-trend { font-size:12px; margin-top:8px; }
.kpi-card .kpi-trend.up { color:var(--success); }
.kpi-card .kpi-trend.down { color:var(--danger); }

/* Charts Grid */
.charts-grid { display:grid; grid-template-columns:2fr 1fr; gap:20px; margin-bottom:24px; }
.chart-card { background:var(--card); border:1px solid var(--border); border-radius:12px; padding:24px; }
.chart-card h3 { font-size:14px; font-weight:600; margin-bottom:16px; color:var(--text); }
.chart-card h3 i { margin-right:8px; color:var(--primary); }

/* Score History */
.score-chart { height:200px; display:flex; align-items:flex-end; gap:8px; padding:10px 0; }
.score-bar { flex:1; min-width:30px; border-radius:6px 6px 0 0; position:relative; transition:all 0.3s; cursor:pointer; }
.score-bar:hover { opacity:0.8; }
.score-bar .bar-label { position:absolute; top:-20px; left:50%; transform:translateX(-50%); font-size:10px; font-weight:600; white-space:nowrap; }
.score-bar .bar-date { position:absolute; bottom:-18px; left:50%; transform:translateX(-50%); font-size:9px; color:var(--muted); }

/* Radar/Skills */
.skills-grid { display:grid; grid-template-columns:1fr 1fr; gap:12px; }
.skill-item { background:rgba(124,77,255,0.1); border:1px solid rgba(124,77,255,0.2); border-radius:8px; padding:12px; }
.skill-item .skill-name { font-size:11px; color:var(--muted); text-transform:uppercase; margin-bottom:6px; }
.skill-item .skill-score { font-size:24px; font-weight:700; }
.skill-item .skill-bar { height:4px; background:var(--border); border-radius:2px; margin-top:8px; overflow:hidden; }
.skill-item .skill-fill { height:100%; border-radius:2px; transition:width 0.5s; }

/* Sessions Table */
.sessions-table { width:100%; border-collapse:collapse; font-size:13px; }
.sessions-table th { text-align:left; padding:10px 12px; background:rgba(124,77,255,0.1); color:var(--muted); font-size:11px; text-transform:uppercase; letter-spacing:0.5px; border-radius:6px; }
.sessions-table td { padding:10px 12px; border-bottom:1px solid var(--border); }
.sessions-table tr:hover { background:rgba(255,255,255,0.02); }
.score-badge { padding:3px 10px; border-radius:12px; font-weight:600; font-size:11px; }
.score-badge.high { background:rgba(0,200,83,0.15); color:var(--success); }
.score-badge.mid { background:rgba(255,145,0,0.15); color:var(--warning); }
.score-badge.low { background:rgba(255,23,68,0.15); color:var(--danger); }

/* Coaching Panel */
.coaching-panel { background:var(--card); border:1px solid var(--border); border-radius:12px; padding:24px; margin-top:20px; }
.coaching-panel h3 { margin-bottom:16px; }
.coaching-item { display:flex; gap:12px; padding:12px 0; border-bottom:1px solid var(--border); }
.coaching-item:last-child { border-bottom:none; }
.coaching-icon { width:36px; height:36px; border-radius:8px; display:flex; align-items:center; justify-content:center; font-size:14px; flex-shrink:0; }
.coaching-icon.improve { background:rgba(255,145,0,0.15); color:var(--warning); }
.coaching-icon.strength { background:rgba(0,200,83,0.15); color:var(--success); }
.coaching-icon.tip { background:rgba(0,176,255,0.15); color:var(--info); }
.coaching-text { font-size:13px; line-height:1.5; }
.coaching-text strong { color:var(--text); }
.coaching-text p { color:var(--muted); margin-top:4px; }

/* Empty State */
.empty-state { text-align:center; padding:80px 40px; }
.empty-state i { font-size:48px; color:var(--muted); margin-bottom:16px; }
.empty-state h2 { font-size:20px; margin-bottom:8px; }
.empty-state p { color:var(--muted); font-size:14px; max-width:400px; margin:0 auto 24px; }
.empty-state a { display:inline-block; padding:12px 24px; background:var(--primary); color:white; border-radius:8px; text-decoration:none; font-weight:600; font-size:14px; }

/* Responsive */
@media(max-width:900px) { .charts-grid { grid-template-columns:1fr; } .container { padding:16px; } }
</style>
</head>
<body>
<div class="header">
  <div>
    <h1><i class="fa-solid fa-chart-line" style="color:var(--accent);margin-right:10px"></i>DGR <span>Coaching Dashboard</span></h1>
    <div class="subtitle">ISV EMEA Demand Generation — Performance Analytics</div>
  </div>
  <div style="display:flex;gap:12px;align-items:center">
    <span class="badge"><i class="fa-solid fa-robot"></i> Gong-Style Analytics</span>
    <select id="dgrSelect" onchange="loadDGR(this.value)" style="background:var(--card);border:1px solid var(--border);color:var(--text);padding:8px 12px;border-radius:8px;font-size:13px">
      <option value="me">My Performance</option>
    </select>
  </div>
</div>

<div class="container" id="mainContent">
  <!-- Populated by JS -->
</div>

<script>
// === DATA LAYER — reads from localStorage (same as roleplay simulator) ===
function safeGet(key) {
  try { var v = localStorage.getItem(key); return v ? JSON.parse(v) : null; } 
  catch(e) { return null; }
}

function getAllSessions() {
  // The roleplay simulator stores: rpStats (overall), rpSessions (array of session results)
  var stats = safeGet('rpStats') || {level:1, xp:0, totalCalls:0, totalMeetings:0, streak:0, badges:[]};
  var sessions = safeGet('rpSessions') || [];
  return {stats: stats, sessions: sessions};
}

function getScoreClass(score) {
  if(score >= 75) return 'high';
  if(score >= 50) return 'mid';
  return 'low';
}

function formatDate(ts) {
  if(!ts) return 'N/A';
  var d = new Date(ts);
  return d.toLocaleDateString('en-GB',{day:'numeric',month:'short'});
}

function renderDashboard() {
  var data = getAllSessions();
  var container = document.getElementById('mainContent');
  
  if(!data.sessions || data.sessions.length === 0) {
    container.innerHTML = '<div class="empty-state">' +
      '<i class="fa-solid fa-phone-slash"></i>' +
      '<h2>No Sessions Yet</h2>' +
      '<p>Complete roleplay sessions to see your coaching analytics here. Each call generates insights on rapport, objection handling, discovery, and closing skills.</p>' +
      '<a href="roleplay.html"><i class="fa-solid fa-play" style="margin-right:8px"></i>Start a Roleplay Session</a>' +
      '</div>';
    return;
  }
  
  // Calculate aggregates
  var totalSessions = data.sessions.length;
  var totalScore = 0, totalRapport = 0, totalObjection = 0, totalDiscovery = 0, totalClosing = 0;
  var meetingsBooked = 0;
  var lastScores = data.sessions.slice(-10); // last 10 for trends
  
  data.sessions.forEach(function(s) {
    var avg = ((s.rapport||0) + (s.objection||0) + (s.discovery||0) + (s.closing||0)) / 4;
    totalScore += avg;
    totalRapport += (s.rapport||0);
    totalObjection += (s.objection||0);
    totalDiscovery += (s.discovery||0);
    totalClosing += (s.closing||0);
    if(s.meetingBooked) meetingsBooked++;
  });
  
  var avgScore = Math.round(totalScore / totalSessions);
  var avgRapport = Math.round(totalRapport / totalSessions);
  var avgObjection = Math.round(totalObjection / totalSessions);
  var avgDiscovery = Math.round(totalDiscovery / totalSessions);
  var avgClosing = Math.round(totalClosing / totalSessions);
  var meetingRate = Math.round((meetingsBooked / totalSessions) * 100);
  
  // Trend (last 3 vs previous 3)
  var recent3 = data.sessions.slice(-3);
  var prev3 = data.sessions.slice(-6, -3);
  var recentAvg = recent3.reduce(function(a,s) { return a + ((s.rapport||0)+(s.objection||0)+(s.discovery||0)+(s.closing||0))/4; }, 0) / Math.max(recent3.length,1);
  var prevAvg = prev3.length > 0 ? prev3.reduce(function(a,s) { return a + ((s.rapport||0)+(s.objection||0)+(s.discovery||0)+(s.closing||0))/4; }, 0) / prev3.length : recentAvg;
  var trend = Math.round(recentAvg - prevAvg);
  var trendClass = trend >= 0 ? 'up' : 'down';
  var trendIcon = trend >= 0 ? '↑' : '↓';
  
  // Build HTML
  var html = '';
  
  // KPI Row
  html += '<div class="kpi-row">';
  html += '<div class="kpi-card"><div class="kpi-label">Overall Score</div><div class="kpi-value" style="color:var(--primary)">' + avgScore + '</div><div class="kpi-trend ' + trendClass + '">' + trendIcon + ' ' + Math.abs(trend) + ' pts vs prev sessions</div></div>';
  html += '<div class="kpi-card"><div class="kpi-label">Total Sessions</div><div class="kpi-value">' + totalSessions + '</div><div class="kpi-trend">Level ' + (data.stats.level||1) + ' • ' + (data.stats.xp||0) + ' XP</div></div>';
  html += '<div class="kpi-card"><div class="kpi-label">Meeting Book Rate</div><div class="kpi-value" style="color:' + (meetingRate >= 50 ? 'var(--success)' : meetingRate >= 30 ? 'var(--warning)' : 'var(--danger)') + '">' + meetingRate + '%</div><div class="kpi-trend">' + meetingsBooked + ' of ' + totalSessions + ' calls</div></div>';
  html += '<div class="kpi-card"><div class="kpi-label">Current Streak</div><div class="kpi-value" style="color:var(--accent)">' + (data.stats.streak||0) + '</div><div class="kpi-trend">🔥 consecutive good calls</div></div>';
  html += '<div class="kpi-card"><div class="kpi-label">Badges Earned</div><div class="kpi-value">' + (data.stats.badges||[]).length + '</div><div class="kpi-trend">of 14 total</div></div>';
  html += '</div>';
  
  // Charts Grid
  html += '<div class="charts-grid">';
  
  // Score History Chart
  html += '<div class="chart-card"><h3><i class="fa-solid fa-chart-bar"></i>Score History (Last 10 Sessions)</h3><div class="score-chart">';
  lastScores.forEach(function(s, i) {
    var avg = Math.round(((s.rapport||0)+(s.objection||0)+(s.discovery||0)+(s.closing||0))/4);
    var color = avg >= 75 ? 'var(--success)' : avg >= 50 ? 'var(--warning)' : 'var(--danger)';
    var height = Math.max(avg * 1.8, 10);
    html += '<div class="score-bar" style="height:' + height + 'px;background:' + color + '">';
    html += '<span class="bar-label" style="color:' + color + '">' + avg + '</span>';
    html += '<span class="bar-date">' + formatDate(s.date) + '</span>';
    html += '</div>';
  });
  html += '</div></div>';
  
  // Skills Breakdown
  html += '<div class="chart-card"><h3><i class="fa-solid fa-radar"></i>Skills Breakdown</h3><div class="skills-grid">';
  var skills = [
    {name:'Rapport', score:avgRapport, color:'var(--info)'},
    {name:'Objection Handling', score:avgObjection, color:'var(--warning)'},
    {name:'Discovery', score:avgDiscovery, color:'var(--success)'},
    {name:'Closing', score:avgClosing, color:'var(--primary)'}
  ];
  skills.forEach(function(sk) {
    html += '<div class="skill-item"><div class="skill-name">' + sk.name + '</div><div class="skill-score" style="color:' + sk.color + '">' + sk.score + '<span style="font-size:14px;color:var(--muted)">/100</span></div><div class="skill-bar"><div class="skill-fill" style="width:' + sk.score + '%;background:' + sk.color + '"></div></div></div>';
  });
  html += '</div></div>';
  html += '</div>';
  
  // Coaching Recommendations
  html += '<div class="coaching-panel"><h3><i class="fa-solid fa-lightbulb" style="color:var(--accent);margin-right:8px"></i>AI Coaching Recommendations</h3>';
  
  // Generate coaching based on scores
  var weakest = skills.sort(function(a,b) { return a.score - b.score; })[0];
  var strongest = skills.sort(function(a,b) { return b.score - a.score; })[0];
  
  html += '<div class="coaching-item"><div class="coaching-icon strength"><i class="fa-solid fa-star"></i></div><div class="coaching-text"><strong>Strength: ' + strongest.name + ' (' + strongest.score + '/100)</strong><p>This is your top skill. Keep leveraging it — ' + (strongest.name === 'Rapport' ? 'your ability to build connection quickly is what gets prospects to open up.' : strongest.name === 'Discovery' ? 'asking great questions is what separates top DGRs from average ones.' : strongest.name === 'Objection Handling' ? 'you handle pushback well. This is rare and valuable.' : 'your closing instinct is strong. You know when to ask for the meeting.') + '</p></div></div>';
  
  html += '<div class="coaching-item"><div class="coaching-icon improve"><i class="fa-solid fa-arrow-up"></i></div><div class="coaching-text"><strong>Focus Area: ' + weakest.name + ' (' + weakest.score + '/100)</strong><p>' + (weakest.name === 'Rapport' ? 'Try using the prospect\'s name more, reference their company specifically in the first 15 seconds, and use permission-based openers ("Is now a bad time?").' : weakest.name === 'Discovery' ? 'Ask more open-ended questions. Top performers ask 3+ questions per call. Try "What\'s your biggest challenge with X?" before pitching.' : weakest.name === 'Objection Handling' ? 'When you hear pushback, pause before responding. Use LARA: Listen → Acknowledge → Respond → Ask. Don\'t counter immediately.' : 'You\'re not asking for the meeting enough. When patience is high and you\'ve delivered value, propose a specific day/time. Don\'t ask "would you be open to..." — say "Does Tuesday at 2pm work?"') + '</p></div></div>';
  
  html += '<div class="coaching-item"><div class="coaching-icon tip"><i class="fa-solid fa-bullseye"></i></div><div class="coaching-text"><strong>Gong Insight: Talk Ratio</strong><p>Top DGRs talk 43% and listen 57% of the time. If you\'re getting "that\'s vague" feedback, you\'re monologuing. Every message should end with a question or pause for the customer to respond. Target: under 5 sentences before asking something.</p></div></div>';
  
  if(meetingRate < 40) {
    html += '<div class="coaching-item"><div class="coaching-icon improve"><i class="fa-solid fa-calendar"></i></div><div class="coaching-text"><strong>Meeting Book Rate: ' + meetingRate + '% (Target: 50%+)</strong><p>Your conversion is below target. Try closing earlier — once you\'ve made 1 specific point that resonates, propose a time. Don\'t wait for "perfect." The best closers propose a specific day: "How about Thursday morning? 15 min max."</p></div></div>';
  }
  
  html += '</div>';
  
  // Recent Sessions Table
  html += '<div class="chart-card" style="margin-top:20px"><h3><i class="fa-solid fa-list"></i>Recent Sessions</h3>';
  html += '<table class="sessions-table"><thead><tr><th>Date</th><th>Persona</th><th>Difficulty</th><th>Rapport</th><th>Objection</th><th>Discovery</th><th>Closing</th><th>Avg</th><th>Meeting?</th></tr></thead><tbody>';
  
  data.sessions.slice(-10).reverse().forEach(function(s) {
    var avg = Math.round(((s.rapport||0)+(s.objection||0)+(s.discovery||0)+(s.closing||0))/4);
    html += '<tr>';
    html += '<td>' + formatDate(s.date) + '</td>';
    html += '<td>' + (s.persona||'—') + '</td>';
    html += '<td>' + (s.difficulty||'medium') + '</td>';
    html += '<td><span class="score-badge ' + getScoreClass(s.rapport||0) + '">' + (s.rapport||0) + '</span></td>';
    html += '<td><span class="score-badge ' + getScoreClass(s.objection||0) + '">' + (s.objection||0) + '</span></td>';
    html += '<td><span class="score-badge ' + getScoreClass(s.discovery||0) + '">' + (s.discovery||0) + '</span></td>';
    html += '<td><span class="score-badge ' + getScoreClass(s.closing||0) + '">' + (s.closing||0) + '</span></td>';
    html += '<td><span class="score-badge ' + getScoreClass(avg) + '">' + avg + '</span></td>';
    html += '<td>' + (s.meetingBooked ? '✅' : '—') + '</td>';
    html += '</tr>';
  });
  html += '</tbody></table></div>';
  
  container.innerHTML = html;
}

// Also need to make the roleplay save session data
// Add listener for messages from roleplay iframe (if embedded)
window.addEventListener('message', function(e) {
  if(e.data && e.data.type === 'sessionComplete') {
    var sessions = safeGet('rpSessions') || [];
    sessions.push(e.data.session);
    try { localStorage.setItem('rpSessions', JSON.stringify(sessions)); } catch(ex) {}
    renderDashboard();
  }
});

function loadDGR(val) { renderDashboard(); }

// Init
document.addEventListener('DOMContentLoaded', renderDashboard);
</script>
</body>
</html>
